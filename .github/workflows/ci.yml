name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Valida o checksum do gradle-wrapper.jar (evita wrapper adulterado).
      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # = toolchain do projeto; Gradle roda e compila no mesmo JDK

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4   # cache do Gradle user home + daemon entre steps

      # Repo criado no Windows costuma perder o bit de exec do gradlew.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Architecture lint (Konsist)
        run: ./gradlew :konsist:test

      - name: Build & test server
        run: ./gradlew :server:build

      - name: Integration tests (Testcontainers + Postgres)
        run: ./gradlew :server:integrationTest   # ubuntu-latest já tem Docker

      - name: Client tests (KMP host)
        run: ./gradlew testAndroidHostTest        # roda em TODOS os módulos que têm a task

      # google-services.json é local (gitignored). Compilar o app NÃO precisa de Firebase
      # real — só de um JSON bem-formado com o package casando. Gera um fake só p/ o CI.
      - name: Fake google-services.json (só p/ compilar)
        run: |
          cat > app/androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fitjourney-ci",
              "storage_bucket": "fitjourney-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "dev.rafael.app" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA0000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # Os ViewModels do módulo de aplicação (Home, menu, perfil, conta) têm task PRÓPRIA:
      # `testAndroidHostTest` só roda nos módulos KMP e nunca tocou nestes.
      #
      # POR QUE isto virou step: entre a fatia B.3 do outbox e a A.0 da Fase 6, este source set
      # NÃO COMPILAVA — um método novo na interface `ProgramRepository` e um fake desatualizado.
      # Os testes da Home atravessaram duas fatias e dois merges sem rodar, e ninguém percebeu,
      # porque só rodavam quando alguém lembrava. Teste que ninguém roda não é cobertura.
      - name: Client tests (módulo app — ViewModels)
        run: ./gradlew :app:androidApp:testDebugUnitTest

      # Compila o app inteiro (Compose/telas) — pega erro de compilação de UI, que nem os
      # testes de host nem os do módulo app cobrem.
      - name: Build Android app (compila UI)
        run: ./gradlew :app:androidApp:assembleDebug